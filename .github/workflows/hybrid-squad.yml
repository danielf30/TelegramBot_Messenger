# Validation pipeline. hybrid-squad-runner dispatches it (workflow_dispatch with one
# JSON string input, "variables") and follows every run through workflow_run events:
# a run on main after a merge moves the issue to workflow::uat.
name: hybrid-squad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      variables:
        description: JSON object sent by hybrid-squad-runner
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]" "ruff==0.15.15"
      - name: Format
        run: python -m ruff format --check send-messages-timertrigger tests
      - name: Lint
        run: python -m ruff check send-messages-timertrigger tests
      - name: Tests
        run: python -m pytest -q
